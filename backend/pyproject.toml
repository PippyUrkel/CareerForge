[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.9.0",
    "httpx>=0.28.0",
    "sqlalchemy[asyncio]>=2.0.40",
    "aiosqlite>=0.21.0",
    "sentence-transformers>=4.1.0",
    "scikit-learn>=1.7.0",
    "numpy>=2.2.0",
    "rapidfuzz>=3.13.0",
    "nltk>=3.9.0",
    "isodate>=0.7.0",
    "python-dotenv>=1.1.0",
    "openai>=1.82.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0.0",
    "httpx>=0.28.0",
]
